{% extends "base.html" %}{% block content %}
<style>
 .login-wrap{min-height:94vh;display:flex;align-items:center;justify-content:center}
 .login-card{display:flex;max-width:820px;width:100%;border:1px solid var(--line);border-radius:.9rem;overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(16,24,40,.08)}
 .login-art{flex:1;background:var(--navy);color:#fff;padding:2.5rem}
 .login-art h3{font-weight:700} .login-art p{color:#b8c4d6}
 .login-art li{list-style:none;margin:.6rem 0;color:#dbe6f5} .login-art li i{color:#60a5fa;margin-right:.5rem}
 .login-form{flex:1;padding:2.5rem}
 @media(max-width:767px){.login-art{display:none}}
</style>
<div class="login-wrap"><div class="login-card">
 <div class="login-art"><div class="fs-2 mb-2" style="color:#60a5fa"><i class="bi bi-box-seam"></i></div><h3>SmartBatch 360</h3><p>Order-to-Audit &amp; Manufacturing Management</p>
  <ul class="ps-0 mt-4"><li><i class="bi bi-check2-circle"></i>BOM-based production control</li><li><i class="bi bi-check2-circle"></i>GST invoicing and dispatch</li><li><i class="bi bi-check2-circle"></i>Stock, costing and variance tracking</li><li><i class="bi bi-check2-circle"></i>Audit-ready reports</li></ul></div>
 <div class="login-form"><h4 class="mb-1">Sign in</h4><p class="text-muted mb-4">Enter your account details</p>
  <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
   <div class="mb-3"><label class="form-label">Username</label><input name="username" class="form-control" required autofocus></div>
   <div class="mb-4"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
   <button class="btn btn-primary w-100 py-2">Sign in</button></form></div>
</div></div>{% endblock %}
