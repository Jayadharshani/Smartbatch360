{% extends "base.html" %}{% block content %}
<style>
 .login-wrap{min-height:94vh;display:flex;align-items:center;justify-content:center}
 .login-card{display:flex;max-width:860px;width:100%;border-radius:1.6rem;overflow:hidden;background:#fff;box-shadow:0 24px 60px rgba(124,58,237,.25)}
 .login-art{flex:1.05;position:relative;overflow:hidden;background:linear-gradient(145deg,#7c3aed 0%,#ec4899 60%,#f97316 100%);color:#fff;padding:2.8rem}
 .login-art::before,.login-art::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
 .login-art::before{width:240px;height:240px;right:-80px;top:-70px}
 .login-art::after{width:180px;height:180px;left:-60px;bottom:-60px}
 .login-art>*{position:relative;z-index:1}
 .login-art h3{font-weight:800;font-size:1.8rem} .login-art p{color:rgba(255,255,255,.88)}
 .login-art .logo{width:58px;height:58px;border-radius:1rem;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin-bottom:1rem;backdrop-filter:blur(6px)}
 .login-art li{list-style:none;margin:.7rem 0;color:#fff;font-weight:500} .login-art li i{margin-right:.55rem;color:#fde68a}
 .login-form{flex:1;padding:2.8rem}
 .login-form h4::after{display:none}
 @media(max-width:767px){.login-art{display:none}}
</style>
<div class="login-wrap"><div class="login-card">
 <div class="login-art"><div class="logo"><i class="bi bi-box-seam"></i></div><h3>SmartBatch 360</h3><p>Order-to-Audit &amp; Manufacturing Management</p>
  <ul class="ps-0 mt-4"><li><i class="bi bi-check2-circle"></i>BOM-based production control</li><li><i class="bi bi-check2-circle"></i>GST invoicing and dispatch</li><li><i class="bi bi-check2-circle"></i>Stock, costing and variance tracking</li><li><i class="bi bi-check2-circle"></i>Audit-ready reports</li></ul></div>
 <div class="login-form"><h4 class="mb-1">Welcome back &#128075;</h4><p class="text-muted mb-4">Enter your account details</p>
  <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
   <div class="mb-3"><label class="form-label">Username</label><input name="username" class="form-control" required autofocus></div>
   <div class="mb-4"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
   <button class="btn btn-primary w-100 py-2">Sign in</button></form></div>
</div></div>{% endblock %}
