{% extends "base.html" %}{% block content %}<h4>Payments</h4>
{% if can_edit %}<form method="post" class="card card-body mb-3"><div class="row g-2"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="col-md-3"><label class="small">Customer</label><select name="customer_id" class="form-select">{% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></div>
<div class="col-md-3"><label class="small">Allocate to invoice</label><select name="invoice_id" class="form-select"><option value="">(keep unallocated)</option>{% for i in open_inv %}<option value="{{ i.id }}">{{ i.invoice_no }} - {{ i.customer.name }} - due {{ i.balance }}</option>{% endfor %}</select></div>
<div class="col-md-2"><label class="small">Amount</label><input name="amount" type="number" step="0.01" class="form-control" required></div>
<div class="col-md-2"><label class="small">Mode</label><select name="mode" class="form-select"><option>Cash</option><option>UPI</option><option>Bank</option><option>Cheque</option></select></div>
<div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary w-100">Record</button></div></div></form>{% endif %}
<table class="table table-sm table-striped bg-white"><tr><th>#</th><th>Date</th><th>Customer</th><th>Mode</th><th>Amount</th><th>Unallocated</th></tr>
{% for p in payments %}<tr><td>{{ p.id }}</td><td>{{ p.pay_date }}</td><td>{{ p.customer.name }}</td><td>{{ p.mode }}</td><td>{{ p.amount }}</td><td>{{ p.unallocated }}</td></tr>{% endfor %}</table>
<a href="{{ url_for('reports.view', key='outstanding') }}">Customer outstanding</a> &middot; <a href="{{ url_for('reports.view', key='ageing') }}">Ageing</a>{% endblock %}
